<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="site-title">UnderGroundZone</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h1 id="header-title">✨ UnderGroundZone</h1>
      <div>
        <label for="lang-select" style="margin-right:6px">Language</label>
        <select id="lang-select" aria-label="Language selector">
          <option value="en">English</option>
          <option value="pl">Polski</option>
        </select>
      </div>
    </div>

    <div id="user-info">
      <p><span id="label-user">👤 Telegram ID:</span> <span id="telegram-id">-</span></p>
      <p><span id="label-tickets">🎟️ Tickets:</span> <span id="tickets">-</span></p>
      <p><span id="label-refs">📣 Referrals:</span> <span id="refs">-</span></p>
    </div>

    <section>
      <h2 id="label-ebooks">📚 Ebooks</h2>
      <div id="ebooks"></div>
    </section>

    <section>
      <h2 id="label-ranking">🏆 Ranking</h2>
      <ol id="ranking"></ol>
    </section>

    <div style="margin-top:12px">
      <button id="refresh">Refresh 🔄</button>
    </div>

    <!-- Admin hidden config -->
    <input type="hidden" id="admin-id" value="">

    <!-- Admin panel -->
    <div id="admin-panel" style="display:none; margin-top:20px; background:#071026; padding:12px; border-radius:8px;">
      <h3 id="admin-title">🔒 Admin Panel</h3>
      <div id="admin-users"></div>
    </div>
  </div>

  <!-- Buy Modal -->
  <div id="modal" class="modal" style="display:none;">
    <div class="modal-content">
      <span id="modal-close" class="modal-close">✖</span>
      <h3 id="modal-title">🛒 Buy ebook</h3>
      <p id="modal-prompt">Select payment mode:</p>
      <button id="modal-buy-sim">Pay (simulation)</button>
      <button id="modal-buy-real">Pay (real)</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
