<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnderGroundZone</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>⚡ UnderGroundZone</h1>
        
        <div id="user-info" class="card">
            <p><strong>👤 Telegram ID:</strong> <span id="user-id">-</span></p>
            <p><strong>🎟️ Tickets:</strong> <span id="user-tickets">-</span></p>
            <p><strong>📣 Referrals:</strong> <span id="user-refs">-</span></p>
        </div>
        
        <div id="referral-section" class="card">
            <h2>Share & Earn 💰</h2>
            <input type="text" id="ref-input" placeholder="Friend's Telegram ID" />
            <button id="ref-btn">Add Referral (+5 tickets)</button>
            <p id="ref-msg"></p>
        </div>
        
        <div id="ranking-section" class="card">
            <h2>🏆 Top Referrers</h2>
            <ol id="ranking-list"></ol>
        </div>
        
        <button id="refresh-btn" class="btn-refresh">Refresh 🔄</button>
    </div>
    
    <script src="/app.js"></script>
</body>
</html>
