<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UndergroundZone</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>


<div class="app">


    <div class="header">

        <h1>⛏️ UndergroundZone</h1>

        <div class="stats">

            <div>
                🎟️ Tickets:
                <b id="tickets">0</b>
            </div>


            <div>
                ⚡ Energy:
                <b id="energy">100</b>
            </div>

        </div>


        <div class="energy-bar">

            <div 
            class="energy-fill"
            id="energyFill">
            </div>

        </div>


    </div>




    <div class="mine-area">


        <button id="pickaxe">

            ⛏️

        </button>


        <p id="message">
            Tap the pickaxe to mine!
        </p>


    </div>





    <div class="profile-card">


        <h2>
            👤 Miner
        </h2>


        <p>
            Level:
            <b id="level">
            1
            </b>
        </p>


        <p>
            💎 Gems:
            <b id="gems">
            0
            </b>
        </p>


    </div>





    <div class="menu">


        <button>
            👤
            <br>
            Profile
        </button>


        <button>
            🛒
            <br>
            Store
        </button>


        <button>
            🎁
            <br>
            Giveaway
        </button>


        <button>
            🌎
            <br>
            Language
        </button>


    </div>



</div>



<script src="app.js"></script>


</body>

</html>
