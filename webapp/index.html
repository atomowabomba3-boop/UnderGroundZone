<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UndergroundZone</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>


<div class="app">


    <div class="header">

        <h1>⛏️ UndergroundZone</h1>

        <div class="stats">

            <div>
                🎟️ Tickets:
                <span id="tickets">1</span>
            </div>


            <div>
                ⚡ Energy:
                <span id="energy">100</span>
            </div>

        </div>

    </div>



    <div class="mine-area">


        <button id="pickaxe">

            ⛏️

        </button>


        <p id="message">
            Tap the pickaxe!
        </p>


    </div>



    <div class="menu">


        <button>
            👤 Profile
        </button>


        <button>
            🛒 Store
        </button>


        <button>
            🎁 Giveaway
        </button>


        <button>
            🌎 Language
        </button>


    </div>


</div>


<script src="app.js"></script>


</body>

</html>
