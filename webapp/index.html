<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnderGroundZone</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <h1>✨ UnderGroundZone</h1>
    <div id="user-info">
      <p>👤 Telegram ID: <span id="telegram-id">-</span></p>
      <p>🎟️ Tickets: <span id="tickets">-</span></p>
      <p>📣 Referrals: <span id="refs">-</span></p>
    </div>

    <section>
      <h2>📚 Ebooks</h2>
      <div id="ebooks"></div>
    </section>

    <section>
      <h2>🏆 Ranking</h2>
      <ol id="ranking"></ol>
    </section>

    <div style="margin-top:12px">
      <button id="refresh">Refresh 🔄</button>
    </div>

    <!-- Admin hidden config -->
    <input type="hidden" id="admin-id" value="">

    <!-- Admin panel -->
    <div id="admin-panel" style="display:none; margin-top:20px; background:#071026; padding:12px; border-radius:8px;">
      <h3>🔒 Admin Panel</h3>
      <div id="admin-users"></div>
    </div>
  </div>

  <!-- Buy Modal -->
  <div id="modal" class="modal" style="display:none;">
    <div class="modal-content">
      <span id="modal-close" class="modal-close">✖</span>
      <h3>🛒 Buy ebook</h3>
      <p>Select payment mode:</p>
      <button id="modal-buy-sim">Pay (simulation)</button>
      <button id="modal-buy-real">Pay (real)</button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
